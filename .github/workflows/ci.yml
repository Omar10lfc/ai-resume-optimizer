name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.12" ]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"

    - name: Install system dependencies (LaTeX for resume compilation)
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          texlive-latex-base \
          texlive-fonts-recommended \
          texlive-latex-extra \
          lmodern

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt

    # Item 2 (follow-up): install Chrome Stable via the official .deb (not the
    # Ubuntu chromium-browser snap stub) so the HTML live-render tests RUN,
    # not skip. TeX Live is already installed by the LaTeX step above (item 2).
    - name: Install Chrome Stable for the HTML live tests
      run: |
        set -e
        curl -sSfL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o /tmp/google-chrome-stable.deb
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/google-chrome-stable.deb
        google-chrome --version

    - name: Print browser availability (Item 4)
      run: python -c "from agent.html_render import HAVE_BROWSER, BROWSER_PATH; print(f'HAVE_BROWSER={HAVE_BROWSER}'); print(f'BROWSER_PATH={BROWSER_PATH}')"

    - name: Run test suite with coverage gate
      run: |
        pytest tests/ -v --cov=agent --cov=app --cov=server --cov-report=term --cov-fail-under=84 -rs
