name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.12" ]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"

    - name: Install system dependencies (LaTeX for resume compilation)
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          texlive-latex-base \
          texlive-fonts-recommended \
          texlive-latex-extra \
          lmodern

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt

    - name: Print browser availability (Item 4)
      run: python -c "from agent.html_render import HAVE_BROWSER, BROWSER_PATH; print(f'HAVE_BROWSER={HAVE_BROWSER}'); print(f'BROWSER_PATH={BROWSER_PATH}')"

    - name: Run test suite with coverage gate
      run: |
        pytest tests/ -v --cov=agent --cov=app --cov=server --cov-report=term --cov-fail-under=84 -rs
