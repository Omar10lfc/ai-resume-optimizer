<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Resume Optimizer</title>
    <meta
      name="description"
      content="Autonomous multi-stage resume optimizer with deterministic ATS keyword scoring, LangGraph human-in-the-loop checkpoints, and LaTeX PDF export."
    />
    <!-- Pre-paint background follows the system scheme; lib/theme.ts flips
         data-theme when the user overrides. CSS only — no inline scripts,
         which keeps MV3 content-security policy intact. -->
    <style>
      html { background-color: #f5f7fb; }
      html[data-theme="dark"] { background-color: #090a0f; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) { background-color: #090a0f; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
